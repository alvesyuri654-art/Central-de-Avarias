# ==============================================================================
# Supabase Configuration - Central de Avarias
# ==============================================================================
project_id = "central-de-avarias"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[storage]
enabled = true
file_size_limit = "52428800" # 50MiB para PDFs de NF-e

[storage.buckets.invoices-pdf]
public = false
file_size_limit = "52428800"
allowed_mime_types = ["application/pdf"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_signup = false # Apenas administradores cadastram novos operadores
